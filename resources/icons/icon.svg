<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="256" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8266ff"/>
      <stop offset="1" stop-color="#4527c4"/>
    </linearGradient>
  </defs>

  <rect width="256" height="256" rx="56" fill="url(#bg)"/>

  <!-- seal ribbon tails -->
  <path d="M100,150 L126,150 L118,232 L110,216 L102,232 Z" fill="#dfa23a"/>
  <path d="M156,150 L130,150 L138,232 L146,216 L154,232 Z" fill="#f6c667"/>

  <!-- seal sunburst rim -->
  <g fill="#efe9ff">
    <rect x="124" y="46" width="8" height="18" rx="3" transform="rotate(0 128 112)"/>
    <rect x="124" y="46" width="8" height="18" rx="3" transform="rotate(30 128 112)"/>
    <rect x="124" y="46" width="8" height="18" rx="3" transform="rotate(60 128 112)"/>
    <rect x="124" y="46" width="8" height="18" rx="3" transform="rotate(90 128 112)"/>
    <rect x="124" y="46" width="8" height="18" rx="3" transform="rotate(120 128 112)"/>
    <rect x="124" y="46" width="8" height="18" rx="3" transform="rotate(150 128 112)"/>
    <rect x="124" y="46" width="8" height="18" rx="3" transform="rotate(180 128 112)"/>
    <rect x="124" y="46" width="8" height="18" rx="3" transform="rotate(210 128 112)"/>
    <rect x="124" y="46" width="8" height="18" rx="3" transform="rotate(240 128 112)"/>
    <rect x="124" y="46" width="8" height="18" rx="3" transform="rotate(270 128 112)"/>
    <rect x="124" y="46" width="8" height="18" rx="3" transform="rotate(300 128 112)"/>
    <rect x="124" y="46" width="8" height="18" rx="3" transform="rotate(330 128 112)"/>
  </g>

  <!-- medallion -->
  <circle cx="128" cy="112" r="50" fill="#ffffff"/>
  <circle cx="128" cy="112" r="50" fill="none" stroke="#d9cdff" stroke-width="3"/>

  <!-- approved check -->
  <path d="M104 114 L122 132 L152 90" fill="none" stroke="#4c2fc7" stroke-width="14"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
